[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdfstruct"
dynamic = ["version"]
description = "Convert PDFs locally with native text extraction or OCR and export structured content to JSON, HTML, TXT, Markdown, CSV, XLSX, DOCX, JSONL and SQLite."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "KelesogluMustafa" }]
keywords = ["pdf", "ocr", "extraction", "json"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pypdfium2>=5,<6",   # native extraction + page rendering for OCR
    "Pillow>=10",
    "openpyxl>=3.1",     # xlsx export
    "python-docx>=1.1",  # docx export
]

[project.optional-dependencies]
dev = ["pytest", "reportlab", "jsonschema", "build"]

[project.scripts]
pdfstruct = "pdfstruct.cli:main"
pdfjson = "pdfstruct.cli:pdfjson"
pdfhtml = "pdfstruct.cli:pdfhtml"
pdftxt = "pdfstruct.cli:pdftxt"
pdfmd = "pdfstruct.cli:pdfmd"
pdfcsv = "pdfstruct.cli:pdfcsv"
pdfxlsx = "pdfstruct.cli:pdfxlsx"
pdfdocx = "pdfstruct.cli:pdfdocx"
pdfjsonl = "pdfstruct.cli:pdfjsonl"
pdfsqlite = "pdfstruct.cli:pdfsqlite"

[tool.hatch.version]
path = "src/pdfstruct/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfstruct"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "schemas", "examples", "config.example.json",
           "README.md", "CHANGELOG.md", "LICENSE", "CLAUDE_RULES.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
