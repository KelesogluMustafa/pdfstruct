[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdfstruct"
dynamic = ["version"]
description = "Convert PDFs, DOCX, text, Markdown, HTML and images locally (native text or OCR) into JSON, HTML, TXT, Markdown, CSV, XLSX, DOCX, JSONL, SQLite and PDF."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
authors = [{ name = "Mustafa Kelesoğlu" }]
keywords = ["pdf", "ocr", "extraction", "json", "docx", "conversion"]
urls = { Homepage = "https://github.com/KelesogluMustafa/pdfstruct", Issues = "https://github.com/KelesogluMustafa/pdfstruct/issues" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "pypdfium2>=5,<6",   # native extraction + page rendering for OCR
    "Pillow>=10",
    "openpyxl>=3.1",     # xlsx export
    "python-docx>=1.1",  # docx input and export
    "reportlab>=5,<6",   # pdf export (BSD; ships the Bitstream Vera fonts it uses)
    # OCR backend, installed automatically where paddlepaddle publishes CPU wheels
    # (Windows x86_64, Linux x86_64, macOS arm64; Python 3.9-3.13). Elsewhere native
    # extraction still works and OCR reports that it is unavailable.
    "paddleocr>=3.7,<4; python_version >= '3.9' and python_version < '3.14' and ((sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'darwin' and platform_machine == 'arm64'))",
    "paddlepaddle>=3.0,<4; python_version >= '3.9' and python_version < '3.14' and ((sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'darwin' and platform_machine == 'arm64'))",
]

[project.optional-dependencies]
# Force the OCR backend on a platform the markers above do not cover.
ocr = ["paddleocr>=3.7,<4", "paddlepaddle>=3.0,<4"]
# Local MCP server for Claude Desktop / Claude Code (pdfstruct-mcp).
mcp = ["mcp>=2,<3"]
# Desktop window (pdfstruct-gui). Qt for Python, LGPL-3.0; only the widgets modules are needed.
gui = ["PySide6-Essentials>=6.7,<7"]
dev = ["pytest", "jsonschema", "build"]

[project.scripts]
pdfstruct = "pdfstruct.cli:main"
pdfjson = "pdfstruct.cli:pdfjson"
pdfhtml = "pdfstruct.cli:pdfhtml"
pdftxt = "pdfstruct.cli:pdftxt"
pdfmd = "pdfstruct.cli:pdfmd"
pdfcsv = "pdfstruct.cli:pdfcsv"
pdfxlsx = "pdfstruct.cli:pdfxlsx"
pdfdocx = "pdfstruct.cli:pdfdocx"
pdfjsonl = "pdfstruct.cli:pdfjsonl"
pdfsqlite = "pdfstruct.cli:pdfsqlite"
pdfstruct-mcp = "pdfstruct.mcp_server:main"

[project.gui-scripts]
pdfstruct-gui = "pdfstruct.gui.app:main"

[tool.hatch.version]
path = "src/pdfstruct/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pdfstruct"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "schemas", "examples", "skills", "scripts", "docs",
           "config.example.json", "setup-windows.cmd", "README.md", "CHANGELOG.md", "LICENSE",
           "THIRD_PARTY_NOTICES.md", "CLAUDE.md", "CLAUDE_RULES.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
